egular,Menlo,Consolas,monospace" font-size="12" fill="#0A0E0D">on('close') ✓</text></g><g class="n" style="animation-delay:1.2s"><rect x="780" y="105" width="124" height="40" rx="10" fill="#141B19" stroke="#7E938A" stroke-opacity=".7"/><text x="842.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#E8F0EC">subscribe()</text></g><g class="n" style="animation-delay:1.8s"><rect x="912" y="105" width="124" height="40" rx="10" fill="#2A1416" stroke="#F2555A" stroke-opacity=".7"/><text x="974.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#E8F0EC">setup fails</text></g><g class="n" style="animation-delay:2.4s"><rect x="1044" y="105" width="124" height="40" rx="10" fill="#12241C" stroke="#1FD17A" stroke-opacity=".7"/><text x="1106.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#E8F0EC">cleaned up ✓</text></g><text x="710.0" y="92" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#FED100">moved earlier</text><text x="516" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7E938A">before: close listener attached after setup → never cleaned → reconnect loop</text></svg>